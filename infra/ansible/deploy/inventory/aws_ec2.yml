---
plugin: amazon.aws.aws_ec2
regions:
  - us-west-1
filters:
  tag:Name:
    - buildserver
    - buildserver-dev
  instance-state-name: running
hostnames:
  - tag:Name
compose:
  ansible_host: instance_id
groups:
  buildserver: "tags.Name == 'buildserver'"
  buildserver_dev: "tags.Name == 'buildserver-dev'"
