services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      BS_LOG_LEVEL: INFO
      BS_DATABASE_PORT: 5432
      BS_DATABASE_USER: postgres
      BS_DATABASE_PASSWORD: postgres
      BS_DATABASE_HOSTNAME: db
      BS_DATABASE_NAME: app
      BS_SLEEP_FOR: 900
      BS_TIMEOUT: 60
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
