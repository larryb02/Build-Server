name: Deploy Buildserver

on:
  push:
    branches: [main]
    paths:
      - "buildserver-api/**"
      # - "buildserver-runner/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  AWS_REGION: us-west-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: buildserver-api
            dockerfile: infra/docker/api.Dockerfile
            version_file: buildserver-api/version.txt
          # - name: buildserver-runner
          #   dockerfile: infra/docker/runner.Dockerfile
          #   version_file: buildserver-runner/version.txt
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        run: echo "VERSION=$(cat ${{ matrix.version_file }})" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest,${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ env.VERSION }}

  tag:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create git tag
        run: |
          VERSION=$(cat buildserver-api/version.txt)
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  deploy-demo:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_RUNNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install Ansible and dependencies
        run: pip install ansible boto3 botocore
      - name: Install amazon.aws collection
        run: ansible-galaxy collection install amazon.aws
      - name: Run playbook
        run: |
          ansible-playbook infra/ansible/deploy/site.yml \
            -i infra/ansible/deploy/inventory/aws_ec2.yml \
            -e "app_port=${{ secrets.APP_PORT }}" \
            -e "secret_key=${{ secrets.BS_SECRET_KEY }}" \
            -e "database_host=${{ secrets.DATABASE_HOST }}" \
            -e "database_port=${{ secrets.DATABASE_PORT }}" \
            -e "database_user=${{ secrets.DATABASE_USER }}" \
            -e "database_password=${{ secrets.DATABASE_PASSWORD }}" \
            -e "domain=${{ secrets.DOMAIN }}"
