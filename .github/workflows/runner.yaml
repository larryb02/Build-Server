name: Buildserver Runner

on:
  push:
    paths:
      - "buildserver-runner/**"
  pull_request:
    branches: [main]
    paths:
      - "buildserver-runner/**"
  workflow_dispatch:

jobs:
  check-with-pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pre-commit
      - name: Check with pre-commit
        run: pre-commit run --all-files

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pylint
      - name: lint
        run: pylint --exit-zero buildserver-runner/

  test:
    runs-on: ubuntu-latest
    needs: [lint, check-with-pre-commit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup external services
        run: |
          docker run --rm -d -p 5672:5672 rabbitmq
      - name: Create env file
        run: echo "${{ secrets.RUNNER_ENV_FILE }}" > buildserver-runner/.env
      - name: Install dependencies
        working-directory: buildserver-runner
        run: |
          pip install --upgrade setuptools pip; \
          pip install pytest; \
          pip install -e .[test]
      - name: Run tests
        working-directory: buildserver-runner
        run: pytest -xv runner/tests

  tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: read_version
        run: echo "version=$(cat buildserver-runner/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "runner-v${{ steps.read_version.outputs.version }}"
          git push origin "runner-v${{ steps.read_version.outputs.version }}"

  release:
    runs-on: ubuntu-latest
    needs: [tag]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build package
        working-directory: buildserver-runner
        run: python -m build --sdist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runner-v${{ needs.tag.outputs.version }}
          files: buildserver-runner/dist/*.tar.gz
