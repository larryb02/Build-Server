name: Buildserver API

on:
  push:
    paths:
      - "buildserver-api/**"
  pull_request:
    branches: [main]
    paths:
      - "buildserver-api/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  AWS_REGION: us-west-1

jobs:
  check-with-pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pre-commit
      - name: Check with pre-commit
        run: pre-commit run --all-files

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pylint
      - name: lint
        run: pylint --exit-zero buildserver/

  test:
    runs-on: ubuntu-latest
    needs: [lint, check-with-pre-commit]
    env:
      BS_SECRET_KEY: openssl rand -hex 32 # generate new key per test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: buildserver-api
        run: |
          pip install --upgrade setuptools pip; \
          pip install pytest; \
          pip install -e .[test]
      - name: Run tests
        run: pytest -xv buildserver-api/buildserver/tests

  tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: read_version
        run: echo "version=$(cat buildserver-api/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "api-v${{ steps.read_version.outputs.version }}"
          git push origin "api-v${{ steps.read_version.outputs.version }}"

  release:
    runs-on: ubuntu-latest
    needs: [tag]
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: api-v${{ needs.tag.outputs.version }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: [tag]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/buildserver-api:latest
            ${{ env.IMAGE_PREFIX }}/buildserver-api:${{ needs.tag.outputs.version }}
